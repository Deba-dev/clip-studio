# Clip Studio licence server. Deploy: npx wrangler deploy (from this folder). Test: node test.mjs
#
# Secrets (npx wrangler secret put NAME). Billing stays off until Google and at least one provider are set:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET                       sign-in (scopes openid email profile)
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET  India, rupees, UPI autopay
#   RAZORPAY_PLAN_3M, RAZORPAY_PLAN_6M, RAZORPAY_PLAN_12M          plan ids from the Razorpay dashboard
#   PADDLE_CLIENT_TOKEN, PADDLE_WEBHOOK_SECRET                    everywhere else, dollars
#   PADDLE_PRICE_3M, PADDLE_PRICE_6M, PADDLE_PRICE_12M             price ids from the Paddle dashboard
#   RESEND_API_KEY                                                licence key emails (optional)
#   ADMIN_TOKEN                                                   gift licences (24+ random characters; see gift.mjs)
name = "clipstudio-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

routes = [{ pattern = "clipstudio.zunimilabs.online", custom_domain = true }]

[vars]
BASE_URL = "https://clipstudio.zunimilabs.online"
MAIL_FROM = "Clip Studio <premium@zunimilabs.online>"
PADDLE_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "clipstudio"
database_id = "REPLACE_AFTER_d1_create"
