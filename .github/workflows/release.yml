name: Release Clip Studio
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, re, pathlib
          version = re.search(r'VERSION = "([^"]+)"', pathlib.Path("clipstudio/version.py").read_text()).group(1)
          if os.environ["GITHUB_REF_NAME"] != "v" + version:
              raise SystemExit("Tag %s does not match app version %s" % (os.environ["GITHUB_REF_NAME"], version))
      - run: pip install -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Run the tests
        run: python -m pytest -q tests
      - name: Get FFmpeg (LGPL build, no x264 or x265)
        shell: pwsh
        run: |
          $name = "ffmpeg-master-latest-win64-lgpl-shared"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item "ffmpeg-download\$name\bin\*" tools\
          Copy-Item "ffmpeg-download\$name\LICENSE.txt" tools\FFMPEG-LICENSE.txt
          Remove-Item tools\ffplay.exe -ErrorAction SilentlyContinue
          Get-FileHash ffmpeg.zip -Algorithm SHA256
      - name: Build the app
        run: pyinstaller --noconfirm --windowed --noupx --name ClipStudio --icon assets\icon.ico --collect-all faster_whisper --collect-all ctranslate2 --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-submodules pytchat --exclude-module tkinter --exclude-module matplotlib --add-data "tools;tools" main.py
      - name: Start the built app once
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:CLIPSTUDIO_DATA = "$env:RUNNER_TEMP\selftest"
          $app = Start-Process dist\ClipStudio\ClipStudio.exe -ArgumentList "--selftest" -PassThru
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw "The app did not finish starting" }
          if ($app.ExitCode -ne 0) { throw "The app failed to start ($($app.ExitCode))" }
      - name: Make a real clip with the built app and its bundled FFmpeg
        run: python scripts/smoke.py
      - run: choco install innosetup -y --no-progress
      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = (Resolve-Path "$env:SystemDrive\Program Files*\Inno Setup *\ISCC.exe" | Select-Object -First 1).Path
          if (-not $iscc) { throw "Inno Setup was not found" }
          $version = ([regex]'VERSION = "([^"]+)"').Match((Get-Content clipstudio\version.py -Raw)).Groups[1].Value
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "The installer could not be made" }
      - name: Install it, then update over the running app
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\cs-install"
          $exe = "$dir\ClipStudio.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:CLIPSTUDIO_DATA = "$env:RUNNER_TEMP\cs-data"
          function Run-Setup {
            $p = Start-Process installer\ClipStudio-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { throw "The installer did not finish" }
            if ($p.ExitCode -ne 0) { throw "The installer failed ($($p.ExitCode))" }
          }
          function Wait-Running {
            for ($i = 0; $i -lt 60; $i++) {
              $found = Get-Process ClipStudio -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe } | Select-Object -First 1
              if ($found) { return $found }
              Start-Sleep 1
            }
            throw "The app did not start after installing"
          }
          Run-Setup
          $first = Wait-Running
          Write-Host "Installed and running, process $($first.Id)"
          Start-Sleep 5
          Run-Setup
          $second = Wait-Running
          if ($second.Id -eq $first.Id) { throw "The update did not close and reopen the app" }
          Write-Host "Updated over the running app, new process $($second.Id)"
          Stop-Process -Name ClipStudio -Force
          Start-Sleep 2
          $app = Start-Process $exe -ArgumentList "--selftest" -PassThru
          $null = $app.Handle
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw "The updated app did not finish starting" }
          if ($app.ExitCode -ne 0) { throw "The updated app failed to start ($($app.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: ClipStudio-Setup
          path: installer/ClipStudio-Setup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Clip Studio ${{ github.ref_name }} (early test version)
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: installer/ClipStudio-Setup.exe
